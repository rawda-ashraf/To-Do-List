<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <section class="todo-app pt-5">
        <div class="container w-50 border rounded-4 border-secondary">

            <header class="row g-5 p-4 app-header">
                <div class="col-xl-6">
                    <h2><i class="fa-solid fa-list-check fw-bold fs-1 pe-3"></i>To-Do List</h2>
                </div>
                <div
                    class="col-xl-6 statistics fw-bold d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div><span id="stat-total" class="pe-2 text-warning">0</span> Total</div>
                    <div>|</div>
                    <div><span id="stat-done" class="pe-2 text-warning">0</span> Done</div>
                    <div>|</div>
                    <div><span id="stat-left" class="pe-2 text-warning">0</span> Left</div>
                </div>
            </header>

            <!-- /////////////////////////////////////////////////////////////////////////////////// -->

            <section class="add-sec row g-3 p-4">
                <input id="task-input" class="col-lg-10 task-input px-4 py-2 rounded-4" autocomplete="off"
                    placeholder=" Add a new task ...">
                <div class="col-lg-2 d-flex align-items-center flex-wrap gap-2">
                    <button id="addBtn" class="btn btn-outline-info rounded-3 px-4 rounded-3"><i
                            class="fa-solid fa-plus pe-1"></i>
                        Add</button>
                </div>
            </section>

            <!-- /////////////////////////////////////////////////////////////////////////////////// -->

            <section class="action-sec row g-3 p-4">

                <div class="col action-control d-flex align-items-center flex-wrap gap-3">
                    <button class="btn btn-outline-info rounded-4 px-4" id="all-btn">All</button>
                    <button class="btn btn-outline-info rounded-4 px-4" id="starred-btn">Starred</button>
                    <button class="btn btn-outline-info rounded-4 px-4" id="completed-btn">Completed</button>
                    <button class="btn btn-outline-info rounded-4 px-4" id="left-btn">Left</button>
                </div>

                <!-- <div class="col-lg-6 d-flex justify-content-end align-items-center">
                    <input class="form-control" placeholder="Search tasks...">
                </div> -->
            </section>

            <!-- /////////////////////////////////////////////////////////////////////////////////// -->

            <section class="content-sec row g-4 p-4 "></section>
            <section class="content-sec row g-4 px-4 py-2">
                <div id="empty-msg" class="text-center w-100 text-info" style="display:none;">
                    <p class="fs-5">No Tasks....</p>
                </div>
            </section>
            <!-- /////////////////////////////////////////////////////////////////////////////////// -->

            <div class="mb-3 p-2 clear-sec" style="display:none;">
                <button class="btn btn-danger clear-btn d-block m-auto">Clear Completed</button>
            </div>

        </div>

    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
        integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/script.js"></script>
</body>

</html>
